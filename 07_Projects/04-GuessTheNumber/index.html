<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess a number</title>
    <link rel="stylesheet" href="../style.css">
     <link rel="stylesheet" href="style.css">
</head>
<body>
     <nav>
        <a href="../index.html">Home</a>
     </nav>
      <div id="wrapper">
         <h1>Number Guessing Game</h2>
      
           <p>Try and guess a random number between 1 and 100</p>
            <p>You have 10 attempts to guess the right now</p>
            <br>

            <form action="form">
                <label for="guessfield" id="guess">Guess a number</label>
                <input type="text" id="guessfield" class="guessfield"><br>
                <input type="submit" id="subt" value="submit guess"
                class="guessSubmit">
            </form>
            <div class="resultParas">
                <p>Previous Guesses : <span class="guesses"></span></p>
                <p>Guesses Remainig : <span class="lastresult">10</span></p>
                  <p class="lowOrHi"></p>
            </div>

      </div>
</body>
<script src="chaiaurcode.js"></script>
</html>
